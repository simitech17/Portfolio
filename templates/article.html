<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{ post.title }} — article by Simone Colavecchia">

    <title>{{ post.title }} — Simone Colavecchia</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="article-page">

    <!-- NAVIGATION -->
    <nav>
        <a href="/" class="nav-mark">
            Simone Colavecchia
        </a>

        <div class="nav-links">
            <a href="/">Profile</a>
            <a href="/#work">Selected Work</a>
            <a href="/publications">Publications</a>
            <a href="/#contact">Contact</a>
            <a href="/download/cv" class="nav-cv">CV ↓</a>
        </div>
    </nav>


    <main class="article-main">

        <!-- ARTICLE HEADER -->
        <header class="article-header">

            <a href="/publications" class="article-back">
                ← Publications
            </a>

            <div class="article-heading">

                <p class="article-topic">
                    {{ post.topic }}
                </p>

                <h1 class="article-title">
                    {{ post.title }}
                </h1>

                {% if post.date %}
                <p class="article-meta">
                    {{ post.date }}
                </p>
                {% endif %}

            </div>

        </header>


        <div class="article-rule"></div>


        <!-- ARTICLE -->
        <article class="article-body">
            {{ post.content | safe }}
        </article>


        <!-- ARTICLE FOOTER -->
        <div class="article-footer">

            <a href="/publications" class="text-link">
                ← Back to publications
            </a>

            <a href="/" class="text-link secondary">
                Simone Colavecchia
            </a>

        </div>

    </main>


    <footer>

        <span>
            © 2026 Simone Colavecchia
        </span>

        <span>
            Milano, Italy
        </span>

    </footer>

</body>

</html>
