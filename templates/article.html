<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} – Simone Colavecchia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            padding-left: 0;
        }

        .article-hero {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 44px 30px;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-family: var(--font-mono);
            margin-bottom: 30px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--ink);
        }

        .article-topic {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--gold);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .article-hero h1 {
            font-family: var(--font-display);
            font-size: 38px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 0;
        }

        .article-divider {
            height: 1px;
            background: var(--rule);
            margin-top: 30px;
        }

        .article-body {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px 44px 100px;
        }

        .article-body p {
            font-family: var(--font-body);
            font-size: 17px;
            line-height: 1.85;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .article-body h2 {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--ink);
            margin: 40px 0 16px;
        }

        .article-body a {
            color: var(--ink);
            border-bottom: 1px solid var(--gold);
            text-decoration: none;
        }

        .article-body a:hover {
            color: var(--gold);
        }

        .article-body blockquote {
            font-family: var(--font-display);
            font-style: italic;
            font-size: 20px;
            color: var(--ink);
            border-left: 2px solid var(--gold);
            padding-left: 20px;
            margin: 32px 0;
        }
    </style>
</head>

<body>

    <nav>
        <span class="nav-mark">Colavecchia</span>
        <a href="/">Home</a>
        <a href="/publications">Publications</a>
        <a href="/#contact">Contact</a>
        <a href="/download/cv" class="nav-cv">Download CV ↓</a>
    </nav>

    <div class="article-hero">
        <a href="/publications" class="back-link">← Back to publications</a>
        <p class="article-topic">{{ post.topic }}</p>
        <h1>{{ post.title }}</h1>
        <div class="article-divider"></div>
    </div>

    <div class="article-body">
        {{ post.content | safe }}
    </div>

</body>

</html>
